<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/css/style.css">
<title>Login - Check do Golpe</title>
</head>
<body>
<main class="app">
<section class="hero-card">
    <h1>Entrar</h1>
    <p class="subtitle">A conta é opcional e serve para acompanhar seu histórico.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <label>E-mail</label>
        <input name="email" type="email" required>

        <label>Senha</label>
        <input name="senha" type="password" required>

        <button class="primary-btn">Entrar</button>
    </form>

    <a href="/" class="link-btn">Continuar sem login</a>
</section>
</main>
<script src="/static/js/install.js"></script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/service-worker.js');
}
</script>
</body>
</html>
