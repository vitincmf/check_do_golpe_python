<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101727">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<title>Cadastro - Check do Golpe</title>
</head>
<body>
<main class="app">
<section class="hero-card">
    <h1>Criar conta</h1>
    <p class="subtitle">Opcional. O quiz também funciona sem cadastro.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required>

        <label for="faixa_etaria_id">Faixa etária</label>
        <select id="faixa_etaria_id" name="faixa_etaria_id" required>
            <option value="">Selecione</option>
            {% for faixa in faixas %}
                <option value="{{ faixa.id }}">{{ faixa.nome }}</option>
            {% endfor %}
        </select>

        <button class="primary-btn">Cadastrar</button>
    </form>

    <a href="/" class="link-btn">Voltar</a>
</section>
</main>
<script src="/static/js/install.js"></script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/service-worker.js');
}
</script>
</body>
</html>
